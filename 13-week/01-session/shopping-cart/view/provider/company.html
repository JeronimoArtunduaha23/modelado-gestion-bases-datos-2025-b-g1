<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Company CRUD</title>
  <link rel="stylesheet" href="../../src/css/main.css">
</head>
<body>
  <header>Company Management</header>
  <nav>
    <a href="../../index.html">Home</a>
  </nav>
  <div class="container">
    <h2>Company CRUD</h2>
    <form class="form-crud">
      <label for="id">ID</label>
      <input type="number" id="id" name="id">
      <label for="company_name">Company Name</label>
      <input type="text" id="company_name" name="company_name">
      <label for="tax_id">Tax ID</label>
      <input type="text" id="tax_id" name="tax_id">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone">
      <label for="email">Email</label>
      <input type="email" id="email" name="email">
      <label for="address">Address</label>
      <input type="text" id="address" name="address">
      <button type="submit">Create</button>
      <button type="button">Update</button>
      <button type="button">Delete</button>
    </form>
    <table class="crud-table">
      <thead>
        <tr>
          <th>ID</th><th>Company Name</th><th>Tax ID</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td><td>Acme Corp</td><td>900123456</td><td>3101234567</td><td>acme@corp.com</td><td>Main St</td>
          <td class="crud-actions"><button>Edit</button><button>Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>
  <footer>&copy; 2025 Shopping Cart System</footer>
</body>
</html>
