<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product CRUD</title>
  <link rel="stylesheet" href="../../src/css/main.css">
</head>
<body>
  <header>Product Management</header>
  <nav>
    <a href="../../index.html">Home</a>
    <a href="category.html">Category</a>
    <a href="inventory.html">Inventory</a>
  </nav>
  <div class="container">
    <h2>Product CRUD</h2>
    <form class="form-crud">
      <label for="id">ID</label>
      <input type="number" id="id" name="id">
      <label for="product_name">Product Name</label>
      <input type="text" id="product_name" name="product_name">
      <label for="description">Description</label>
      <input type="text" id="description" name="description">
      <label for="unit_price">Unit Price</label>
      <input type="number" step="0.01" id="unit_price" name="unit_price">
      <label for="category_id">Category ID</label>
      <input type="number" id="category_id" name="category_id">
      <button type="submit">Create</button>
      <button type="button">Update</button>
      <button type="button">Delete</button>
    </form>
    <table class="crud-table">
      <thead>
        <tr>
          <th>ID</th><th>Product Name</th><th>Description</th><th>Unit Price</th><th>Category ID</th><th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td><td>Laptop</td><td>Portable computer</td><td>1200.00</td><td>1</td>
          <td class="crud-actions"><button>Edit</button><button>Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>
  <footer>&copy; 2025 Shopping Cart System</footer>
</body>
</html>
