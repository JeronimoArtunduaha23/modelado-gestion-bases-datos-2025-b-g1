<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Role CRUD</title>
  <link rel="stylesheet" href="../../src/css/main.css">
</head>
<body>
  <header>Role Management</header>
  <nav>
    <a href="../../index.html">Home</a>
    <a href="person.html">Person</a>
    <a href="user_account.html">User Account</a>
  </nav>
  <div class="container">
    <h2>Role CRUD</h2>
    <form class="form-crud">
      <label for="id">ID</label>
      <input type="number" id="id" name="id">
      <label for="role_name">Role Name</label>
      <input type="text" id="role_name" name="role_name">
      <label for="description">Description</label>
      <input type="text" id="description" name="description">
      <button type="submit">Create</button>
      <button type="button">Update</button>
      <button type="button">Delete</button>
    </form>
    <table class="crud-table">
      <thead>
        <tr>
          <th>ID</th><th>Role Name</th><th>Description</th><th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td><td>Admin</td><td>Administrator role</td>
          <td class="crud-actions"><button>Edit</button><button>Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>
  <footer>&copy; 2025 Shopping Cart System</footer>
</body>
</html>
