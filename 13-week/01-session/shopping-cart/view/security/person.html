<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Person CRUD</title>
  <link rel="stylesheet" href="../../src/css/main.css">
</head>
<body>
  <header>Person Management</header>
  <nav>
    <a href="../../index.html">Home</a>
    <a href="role.html">Role</a>
    <a href="user_account.html">User Account</a>
  </nav>
  <div class="container">
    <h2>Person CRUD</h2>
    <form class="form-crud">
      <label for="id">ID</label>
      <input type="number" id="id" name="id">
      <label for="document_type">Document Type</label>
      <input type="text" id="document_type" name="document_type">
      <label for="document_number">Document Number</label>
      <input type="text" id="document_number" name="document_number">
      <label for="first_name">First Name</label>
      <input type="text" id="first_name" name="first_name">
      <label for="last_name">Last Name</label>
      <input type="text" id="last_name" name="last_name">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone">
      <label for="email">Email</label>
      <input type="email" id="email" name="email">
      <label for="address">Address</label>
      <input type="text" id="address" name="address">
      <button type="submit">Create</button>
      <button type="button">Update</button>
      <button type="button">Delete</button>
    </form>
    <table class="crud-table">
      <thead>
        <tr>
          <th>ID</th><th>Document Type</th><th>Document Number</th><th>First Name</th><th>Last Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td><td>CC</td><td>123456</td><td>John</td><td>Doe</td><td>3001234567</td><td>john@example.com</td><td>Street 1</td>
          <td class="crud-actions"><button>Edit</button><button>Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>
  <footer>&copy; 2025 Shopping Cart System</footer>
</body>
</html>
