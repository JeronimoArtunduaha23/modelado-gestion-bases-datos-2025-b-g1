<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Invoice CRUD</title>
  <link rel="stylesheet" href="../../src/css/main.css">
</head>
<body>
  <header>Invoice Management</header>
  <nav>
    <a href="../../index.html">Home</a>
    <a href="invoice_detail.html">Invoice Detail</a>
    <a href="branch.html">Branch</a>
  </nav>
  <div class="container">
    <h2>Invoice CRUD</h2>
    <form class="form-crud">
      <label for="id">ID</label>
      <input type="number" id="id" name="id">
      <label for="invoice_number">Invoice Number</label>
      <input type="text" id="invoice_number" name="invoice_number">
      <label for="issue_date">Issue Date</label>
      <input type="date" id="issue_date" name="issue_date">
      <label for="client_id">Client ID</label>
      <input type="number" id="client_id" name="client_id">
      <label for="user_account_id">User Account ID</label>
      <input type="number" id="user_account_id" name="user_account_id">
      <label for="total">Total</label>
      <input type="number" step="0.01" id="total" name="total">
      <button type="submit">Create</button>
      <button type="button">Update</button>
      <button type="button">Delete</button>
    </form>
    <table class="crud-table">
      <thead>
        <tr>
          <th>ID</th><th>Invoice Number</th><th>Issue Date</th><th>Client ID</th><th>User Account ID</th><th>Total</th><th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td><td>INV-001</td><td>2025-10-29</td><td>1</td><td>1</td><td>1500.00</td>
          <td class="crud-actions"><button>Edit</button><button>Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>
  <footer>&copy; 2025 Shopping Cart System</footer>
</body>
</html>
