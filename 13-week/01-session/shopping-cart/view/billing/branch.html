<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Branch CRUD</title>
  <link rel="stylesheet" href="../../src/css/main.css">
</head>
<body>
  <header>Branch Management</header>
  <nav>
    <a href="../../index.html">Home</a>
    <a href="invoice.html">Invoice</a>
    <a href="invoice_detail.html">Invoice Detail</a>
  </nav>
  <div class="container">
    <h2>Branch CRUD</h2>
    <form class="form-crud">
      <label for="id">ID</label>
      <input type="number" id="id" name="id">
      <label for="branch_name">Branch Name</label>
      <input type="text" id="branch_name" name="branch_name">
      <label for="address">Address</label>
      <input type="text" id="address" name="address">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone">
      <label for="company_id">Company ID</label>
      <input type="number" id="company_id" name="company_id">
      <button type="submit">Create</button>
      <button type="button">Update</button>
      <button type="button">Delete</button>
    </form>
    <table class="crud-table">
      <thead>
        <tr>
          <th>ID</th><th>Branch Name</th><th>Address</th><th>Phone</th><th>Company ID</th><th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td><td>Main Branch</td><td>Main St</td><td>3101234567</td><td>1</td>
          <td class="crud-actions"><button>Edit</button><button>Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>
  <footer>&copy; 2025 Shopping Cart System</footer>
</body>
</html>
